<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
<html>

<head>
    <title>Student Marks Table</title>
</head>

<body>

    <h1>Student Marks Table</h1>

    <table border="2"
           cellpadding="10"
           cellspacing="5"
           width="80%"
           align="center">

        <!-- Table Caption -->
        <caption><b>Student Performance Report</b></caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>S.No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>

            <tr style="background-color: lightblue;">
                <td>1</td>
                <td>Dhruv</td>
                <td>CSE</td>
                <td>HTML</td>
                <td>95</td>
            </tr>

            <tr style="background-color: lightgreen;">
                <td>2</td>
                <td>Rahul</td>
                <td>CSE</td>
                <td>Python</td>
                <td>88</td>
            </tr>

            <tr style="background-color: lightyellow;">
                <td>3</td>
                <td>Aman</td>
                <td>CSE</td>
                <td>Mathematics</td>
                <td>92</td>
            </tr>

            <tr style="background-color: lightpink;">
                <td>4</td>
                <td>Riya</td>
                <td>CSE</td>
                <td>Computer Networks</td>
                <td>85</td>
            </tr>

            <tr style="background-color: rgb(27, 27, 131);">
                <td>5</td>
                <td>Neha</td>
                <td>CSE</td>
                <td>DBMS</td>
                <td>90</td>
            </tr>

        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr style="background-color: lightgray;">
                <td colspan="4"><b>Average Marks</b></td>
                <td><b>90</b></td>
            </tr>
        </tfoot>

    </table>

</body>

</html>
</body>
</html>
